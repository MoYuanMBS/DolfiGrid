<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溯素主题 - 明亮战术电竞UI排版模板</title>

    <!-- 字体可以固定使用；这里改为相对路径，方便整体移动项目目录。 -->
    <style id="local-fonts">
        @font-face {
            font-family: 'Source Han Sans CN';
            src: url('../fonts/SourceHanSansCN-VF.woff2') format('woff2-variations');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <link rel="stylesheet" href="../css/themes/bright.css" data-theme-stylesheet>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <style id="layout-config">
        :root {
            --decor-block-height: 0px;
            --canvas-min-height: 0px;
            --canvas-layout-width: 1280px;
        }
    </style>
</head>
<body>
    <div class="canvas-container canvas">
        <header class="header-banner" data-section="header" data-md-role="document" data-md-id="header">
            <div class="hud-tag" data-bind="hud_tag" data-md-field="label" data-md-scope="header">TACTICAL SERVICE MENU // 战术导引菜单</div>
            <h1 class="main-title" data-bind="document.title" data-md-field="title" data-md-scope="header" data-md-empty="remove"></h1>
            <p class="sub-title" data-bind="subtitle" data-md-field="subtitle" data-md-scope="header" data-md-empty="remove"></p>
        </header>

        <section class="section-block" data-section="experience" data-md-role="section" data-md-id="experience" data-md-heading-level="2" data-layout-grow style="--layout-grow: 1">
            <div class="section-header">
                <div class="section-title-group">
                    <h2 class="section-title-cn" data-bind="sections.exp.title_cn" data-md-field="title" data-md-scope="experience" data-md-format="spaced-cjk">体 验</h2>
                    <span class="section-title-en" data-bind="label.experience_en" data-md-field="label" data-md-scope="experience">EXPERIENCE PACKAGES</span>
                </div>
                <span class="section-status-badge" data-bind="label.experience_status" data-md-field="status" data-md-scope="experience">SECTION // 01</span>
            </div>
            <div class="pkg-grid grid-col-2">
                <div class="card theme-a" data-fill="image" data-card-id="exp-1" data-md-role="card" data-md-id="exp-1" data-md-heading-level="3">
                    <div class="card-header">
                        <h3 class="card-title" data-bind="exp.card1.title" data-md-field="title" data-md-scope="exp-1"></h3>
                        <span class="card-badge" data-bind="label.experience_badge_1" data-md-field="badge" data-md-scope="exp-1">OPTION A</span>
                    </div>
                    <div class="card-media-placeholder" data-bind-media="exp.card1.media" data-md-field="media" data-md-scope="exp-1" data-media-file="">
                    </div>
                    <ul class="list-group" data-bind-list="exp.card1.items" data-md-field="items" data-md-scope="exp-1">
                    </ul>
                </div>
                <div class="card theme-b experience-feature-card" data-card-id="exp-2" data-md-role="card" data-md-id="exp-2" data-md-heading-level="3">
                    <div class="card-header">
                        <h3 class="card-title" data-bind="exp.card2.title" data-md-field="title" data-md-scope="exp-2"></h3>
                        <span class="card-badge" data-bind="label.experience_badge_2" data-md-field="badge" data-md-scope="exp-2">OPTION B</span>
                    </div>
                    <ul class="list-group" data-bind-list="exp.card2.items" data-md-field="items" data-md-scope="exp-2">
                    </ul>
                </div>
            </div>
        </section>

        <section class="section-block" data-section="escort" data-md-role="section" data-md-id="escort" data-md-heading-level="2" data-layout-grow style="--layout-grow: 1">
            <div class="section-header">
                <div class="section-title-group">
                    <h2 class="section-title-cn" data-bind="sections.escort.title_cn" data-md-field="title" data-md-scope="escort" data-md-format="spaced-cjk">护 航</h2>
                    <span class="section-title-en" data-bind="label.escort_en" data-md-field="label" data-md-scope="escort">ESCORT SERVICES</span>
                </div>
                <span class="section-status-badge" data-bind="label.escort_status" data-md-field="status" data-md-scope="escort">SECTION // 02</span>
            </div>
            <div class="pkg-grid grid-col-2">
                <div class="card theme-a" data-card-id="escort-guarantee" data-md-role="card" data-md-id="escort-guarantee" data-md-heading-level="3">
                    <div class="card-header">
                        <h3 class="card-title text-accent-mint" data-bind="escort.guarantee.title" data-md-field="title" data-md-scope="escort-guarantee" data-md-format="spaced-cjk">保 低</h3>
                        <span class="card-badge" data-bind="label.guarantee_badge" data-md-field="badge" data-md-scope="escort-guarantee">GUARANTEED</span>
                    </div>
                    <ul class="list-group" data-bind-list="escort.guarantee.items" data-md-field="items" data-md-scope="escort-guarantee">
                    </ul>
                </div>
                <div class="card theme-c" data-fill="image" data-card-id="escort-match" data-md-role="card" data-md-id="escort-match" data-md-heading-level="3">
                    <div class="card-header">
                        <h3 class="card-title text-accent-violet" data-bind="escort.match.title" data-md-field="title" data-md-scope="escort-match" data-md-format="spaced-cjk">单 局</h3>
                        <span class="card-badge" data-bind="label.match_badge" data-md-field="badge" data-md-scope="escort-match">PER MATCH</span>
                    </div>
                    <div class="card-media-placeholder" data-bind-media="exp.card2.media" data-md-field="media" data-md-scope="exp-2" data-media-file="">
                    </div>

                    <ul class="list-group" data-bind-list="escort.match.items" data-md-field="items" data-md-scope="escort-match">
                    </ul>
                </div>
            </div>
        </section>

        <section class="section-block" data-section="notice" data-md-role="section" data-md-id="notice" data-md-heading-level="2">
            <div class="section-header">
                <div class="section-title-group">
                    <h2 class="section-title-cn" data-bind="sections.notice.title_cn" data-md-field="title" data-md-scope="notice">须 知</h2>
                    <span class="section-title-en" data-bind="label.notice_en" data-md-field="label" data-md-scope="notice">TERMS & NOTICE</span>
                </div>
                <span class="section-status-badge" data-bind="label.notice_status" data-md-field="status" data-md-scope="notice">SECTION // 03</span>
            </div>
            <div class="notice-box">
                <span class="notice-label" data-bind="label.notice_tag" data-md-field="tag" data-md-scope="notice">NOTICE / 须知说明</span>
                <div class="notice-content-list" data-bind-list="notice.items" data-md-field="items" data-md-scope="notice">
                </div>
            </div>
        </section>

        <section class="copyright-section" data-section="copyright">
            <span class="copyright-text" data-bind="copyright.text">*以上内容最终解释权归溯流电竞所有</span>
        </section>

        <section class="section-block" data-section="decorative" data-md-role="placeholder" data-md-id="decorative">
            <div class="decorative-block" data-bind="decorative.block" data-placeholder="art-text" data-placeholder-lines="1"></div>
        </section>
    </div>
</body>
</html>
